# ABOUTME: tmtools application shell: an eframe window with the module tab bar, the file and run list, and the
# ABOUTME: shared playback bar. Modules are registered in main.rs.
[package]
name = "tmtools-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tmtools"
path = "src/main.rs"

[dependencies]
tmtools-core = { path = "../tmtools-core" }
tmreplay = { path = "../tmreplay" }
inputscope = { path = "../inputscope" }
telemetry = { path = "../telemetry" }
trajmap = { path = "../trajmap" }
gbxinspect = { path = "../gbxinspect" }
replayview = { path = "../replayview" }
egui.workspace = true
eframe = { workspace = true, features = ["persistence"] }
rfd.workspace = true
png = "0.17"
